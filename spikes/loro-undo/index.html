<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Loro Undo PoC</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: ui-sans-serif, system-ui, sans-serif;
			}
			body {
				margin: 0;
				padding: 16px;
				line-height: 1.5;
			}
			h1 {
				font-size: 18px;
				margin: 0 0 4px;
			}
			.hint {
				margin: 0 0 16px;
				opacity: 0.7;
				font-size: 12px;
			}
			.panes {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
				gap: 16px;
			}
			section {
				border: 1px solid color-mix(in oklab, currentColor 20%, transparent);
				border-radius: 8px;
				padding: 12px;
			}
			h2 {
				font-size: 14px;
				margin: 0 0 8px;
			}
			.buttons {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				margin-bottom: 8px;
			}
			button {
				font: inherit;
				font-size: 12px;
				padding: 4px 8px;
				border-radius: 6px;
				border: 1px solid color-mix(in oklab, currentColor 30%, transparent);
				background: transparent;
				cursor: pointer;
			}
			button:disabled {
				opacity: 0.4;
				cursor: default;
			}
			ul {
				list-style: none;
				margin: 8px 0;
				padding: 0;
				font-size: 13px;
			}
			li {
				padding: 2px 0;
			}
			li[data-selected="true"] {
				background: color-mix(in oklab, currentColor 12%, transparent);
			}
			.status {
				font-size: 12px;
				opacity: 0.8;
				white-space: pre-line;
				min-height: 3em;
			}
		</style>
	</head>
	<body>
		<h1>Loro Undo PoC</h1>
		<p class="hint">
			同じ LoroDoc に対して「元に戻す / やり直す」を UndoManager で行う。リモート側の変更は undo
			で巻き戻らない。
		</p>
		<div class="panes">
			<section>
				<h2>ローカル (peer 1)</h2>
				<div class="buttons">
					<button id="add-root" type="button">作品を追加</button>
					<button id="add-child" type="button">子項目を追加</button>
					<button id="retitle" type="button">タイトル変更</button>
					<button id="move-root" type="button">ルートへ移動</button>
					<button id="delete" type="button">削除</button>
					<button id="undo" type="button">元に戻す</button>
					<button id="redo" type="button">やり直す</button>
					<button id="normalize" type="button">正規化 (undo対象外)</button>
				</div>
				<label for="selection">選択中の項目</label>
				<select id="selection"></select>
				<ul id="tree"></ul>
				<p class="status" id="status"></p>
			</section>
			<section>
				<h2>リモート (peer 2)</h2>
				<div class="buttons">
					<button id="remote-add" type="button">項目を追加</button>
					<button id="remote-retitle" type="button">タイトル変更</button>
					<button id="remote-delete" type="button">削除</button>
					<button id="push" type="button">ローカル → リモート</button>
					<button id="pull" type="button">リモート → ローカル</button>
				</div>
				<ul id="remote-tree"></ul>
				<p class="status" id="remote-status"></p>
			</section>
		</div>
		<script type="module" src="/main.ts"></script>
	</body>
</html>
