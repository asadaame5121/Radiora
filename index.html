<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#05070b" />
		<link rel="icon" href="/favicon.ico" sizes="any" type="image/x-icon" />
		<link rel="manifest" href="/manifest.json" />
		<title>Radiora v2</title>
	</head>
	<body>
		<div id="app"></div>
		<script>
		const rendererLog = (message) =>
			fetch("/api/renderer-log", { method: "POST", body: String(message) })
				.catch(() => undefined);
		window.addEventListener(
			"error",
			(event) =>
				rendererLog(
					`window.error: ${event.message} at ${event.filename}:${event.lineno}:${event.colno}`,
				),
		);
		window.addEventListener(
			"unhandledrejection",
			(event) => rendererLog(`unhandledrejection: ${event.reason?.stack ?? event.reason}`),
		);
		rendererLog("index.html inline script started");
		</script>
		<script type="module" src="/src/ui/main.ts"></script>
	</body>
</html>
