name: Weekly quality audit

on:
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        batch: [parsers, projections, domain, storage, controllers, tree]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.10.17"
          sha256: ${{ runner.os == 'Windows' && 'd38bd78b63ca1e913e1d55cbd1633b45e9b01f2735ac81b1915f84f75a3eb5cd' || 'fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a' }}
          cache: false
          install_args: --locked
      - run: npm ci
      - name: Restore incremental mutation results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: reports/mutation/${{ matrix.batch }}-incremental.json
          key: mutation-${{ matrix.batch }}-${{ runner.os }}-${{ hashFiles('package-lock.json', 'deno.lock') }}-${{ github.run_id }}
          restore-keys: |
            mutation-${{ matrix.batch }}-${{ runner.os }}-${{ hashFiles('package-lock.json', 'deno.lock') }}-
      - name: Run mutation batch
        env:
          BATCH: ${{ matrix.batch }}
        run: mise run mutation:run "$BATCH"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-${{ matrix.batch }}
          path: reports/mutation/
          if-no-files-found: warn

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.10.17"
          sha256: ${{ runner.os == 'Windows' && 'd38bd78b63ca1e913e1d55cbd1633b45e9b01f2735ac81b1915f84f75a3eb5cd' || 'fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a' }}
          cache: false
          install_args: --locked
      - run: npm ci
      - run: mise run coverage:frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage/
            reports/coverage/

  visual:
    name: Visual regression
    # Baselines are intentionally captured on Windows to match the desktop target.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.10.17"
          sha256: ${{ runner.os == 'Windows' && 'd38bd78b63ca1e913e1d55cbd1633b45e9b01f2735ac81b1915f84f75a3eb5cd' || 'fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a' }}
          cache: false
          install_args: --locked
      - run: npm ci
      - run: npx playwright install chromium
      - run: mise run test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: visual-test-results
          path: test-results/
