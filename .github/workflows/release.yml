name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows bundle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: deno task build

      - name: Build Windows desktop bundle
        run: deno task desktop:build

      - name: Verify Windows bundle artifacts
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "dist-desktop\radiora-v2-windows"
          $launcher = Join-Path $bundleDir "radiora-v2-windows.exe"
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw "The Windows bundle does not contain launcher: $launcher"
          }
          $forbidden = @("surreal.exe", "surreal", "radiora-surreal.exe", "radiora-surreal")
          foreach ($item in $forbidden) {
            $artifactPath = Join-Path $bundleDir $item
            if (Test-Path -LiteralPath $artifactPath) {
              throw "The Windows bundle unexpectedly contains $item: $artifactPath"
            }
          }
          Write-Host "Verified Windows bundle launcher is present and Surreal artifacts are absent."

      - name: Package release archive
        shell: pwsh
        run: |
          $archive = "radiora-v2-windows-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path "dist-desktop\radiora-v2-windows" -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: radiora-release-windows
          path: radiora-v2-windows-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: deno task build

      - name: Build Linux desktop bundle
        run: deno task desktop:build

      - name: Verify Linux bundle artifacts
        shell: bash
        run: |
          launcher="dist-desktop/radiora-v2-linux/radiora-v2-linux"
          if [ ! -x "$launcher" ]; then
            echo "The Linux bundle launcher is missing or not executable: $launcher" >&2
            exit 1
          fi
          for artifact in "surreal" "surreal.exe" "radiora-surreal" "radiora-surreal.exe"; do
            if [ -e "dist-desktop/radiora-v2-linux/$artifact" ]; then
              echo "The Linux bundle unexpectedly contains $artifact" >&2
              exit 1
            fi
          done
          echo "Verified Linux bundle launcher is present and Surreal artifacts are absent."

      - name: Package release archive
        shell: bash
        run: |
          tar -czf "radiora-v2-linux-${GITHUB_REF_NAME}.tar.gz" -C dist-desktop radiora-v2-linux

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: radiora-release-linux
          path: radiora-v2-linux-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: radiora-release-*
          path: release-assets
          merge-multiple: true

      - name: Create initial Linux update manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '{\n  "version": "%s",\n  "patches": {}\n}\n' "$version" > release-assets/latest.json

      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## " version " -" { in_section = 1; print; next }
            in_section && $0 ~ /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          body_path: release-notes.md
