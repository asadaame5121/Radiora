name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows bundle and publish release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SURREALDB_VERSION: "3.2.3"
      SURREALDB_SHA256: "26311fce16da743cbf26f6edda3ec2427fa783eadb67301f676af7c63101f31a"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: deno task build

      - name: Download and verify SurrealDB CLI
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "surreal.exe"
          $url = "https://download.surrealdb.com/v$env:SURREALDB_VERSION/surreal-v$env:SURREALDB_VERSION.windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile $destination
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
          if ($actual -ne $env:SURREALDB_SHA256) {
            throw "SurrealDB CLI SHA-256 mismatch. Expected $env:SURREALDB_SHA256, got $actual"
          }
          "RADIORA_SURREAL_BUNDLE_SOURCE=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified SurrealDB CLI $env:SURREALDB_VERSION ($actual)"

      - name: Build Windows desktop bundle
        run: deno task desktop:build

      - name: Verify SurrealDB CLI is bundled
        shell: pwsh
        run: |
          $bundled = Join-Path $env:GITHUB_WORKSPACE "dist-desktop\radiora-v2-windows\surreal.exe"
          if (-not (Test-Path -LiteralPath $bundled -PathType Leaf)) {
            throw "The Windows bundle does not contain surreal.exe: $bundled"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundled).Hash.ToLowerInvariant()
          if ($actual -ne $env:SURREALDB_SHA256) {
            throw "Bundled SurrealDB CLI SHA-256 mismatch. Expected $env:SURREALDB_SHA256, got $actual"
          }
          Write-Host "Verified bundled SurrealDB CLI ($actual)"

      - name: Package release archive
        run: |
          $archive = "radiora-v2-windows-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path "dist-desktop\radiora-v2-windows" -DestinationPath $archive -CompressionLevel Optimal
          echo "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
