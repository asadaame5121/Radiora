name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows bundle and publish release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: deno task build

      - name: Build Windows desktop bundle
        run: deno task desktop:build

      - name: Package release archive
        run: |
          $archive = "radiora-v2-windows-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path "dist-desktop\radiora-v2-windows" -DestinationPath $archive -CompressionLevel Optimal
          echo "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
