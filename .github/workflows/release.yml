name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows bundle
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SURREALDB_VERSION: "3.2.3"
      SURREALDB_SHA256: "26311fce16da743cbf26f6edda3ec2427fa783eadb67301f676af7c63101f31a"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: deno task build

      - name: Download and verify SurrealDB CLI
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "surreal.exe"
          $url = "https://download.surrealdb.com/v$env:SURREALDB_VERSION/surreal-v$env:SURREALDB_VERSION.windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile $destination
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
          if ($actual -ne $env:SURREALDB_SHA256) {
            throw "SurrealDB CLI SHA-256 mismatch. Expected $env:SURREALDB_SHA256, got $actual"
          }
          "RADIORA_SURREAL_BUNDLE_SOURCE=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified SurrealDB CLI $env:SURREALDB_VERSION ($actual)"

      - name: Build Windows desktop bundle
        run: deno task desktop:build

      - name: Verify SurrealDB CLI is bundled
        shell: pwsh
        run: |
          $bundled = Join-Path $env:GITHUB_WORKSPACE "dist-desktop\radiora-v2-windows\surreal.exe"
          if (-not (Test-Path -LiteralPath $bundled -PathType Leaf)) {
            throw "The Windows bundle does not contain surreal.exe: $bundled"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundled).Hash.ToLowerInvariant()
          if ($actual -ne $env:SURREALDB_SHA256) {
            throw "Bundled SurrealDB CLI SHA-256 mismatch. Expected $env:SURREALDB_SHA256, got $actual"
          }
          Write-Host "Verified bundled SurrealDB CLI ($actual)"

      - name: Verify SurrealDB sidecar is bundled
        shell: pwsh
        run: |
          $sidecar = Join-Path $env:GITHUB_WORKSPACE "dist-desktop\radiora-v2-windows\radiora-surreal.exe"
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "The Windows bundle does not contain radiora-surreal.exe: $sidecar"
          }
          Write-Host "Verified bundled SurrealDB sidecar: $sidecar"

      - name: Package release archive
        shell: pwsh
        run: |
          $archive = "radiora-v2-windows-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path "dist-desktop\radiora-v2-windows" -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: radiora-release-windows
          path: radiora-v2-windows-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SURREALDB_VERSION: "3.2.3"
      SURREALDB_LINUX_SHA256: "f8daafa0655fb3825e6a23911a808e80a2621acff231ccbe9364cae9987e9d84"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: deno task build

      - name: Download and verify SurrealDB CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/surreal-v${SURREALDB_VERSION}.linux-amd64.tgz"
          url="https://github.com/surrealdb/surrealdb/releases/download/v${SURREALDB_VERSION}/surreal-v${SURREALDB_VERSION}.linux-amd64.tgz"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "$SURREALDB_LINUX_SHA256  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/surreal"
          echo "RADIORA_SURREAL_BUNDLE_SOURCE=$RUNNER_TEMP/surreal" >> "$GITHUB_ENV"
          echo "Verified SurrealDB CLI $SURREALDB_VERSION ($SURREALDB_LINUX_SHA256)"

      - name: Build Linux desktop bundle
        run: deno task desktop:build

      - name: Verify Linux bundle
        shell: bash
        run: |
          bundled="dist-desktop/radiora-v2-linux/surreal"
          test -x "$bundled"
          cmp --silent "$RUNNER_TEMP/surreal" "$bundled"
          test -x "dist-desktop/radiora-v2-linux/radiora-v2-linux"
          echo "Verified Linux bundle and bundled SurrealDB CLI"

      - name: Package release archive
        shell: bash
        run: |
          tar -czf "radiora-v2-linux-${GITHUB_REF_NAME}.tar.gz" -C dist-desktop radiora-v2-linux

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: radiora-release-linux
          path: radiora-v2-linux-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: radiora-release-*
          path: release-assets
          merge-multiple: true

      - name: Create initial Linux update manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '{\n  "version": "%s",\n  "patches": {}\n}\n' "$version" > release-assets/latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
