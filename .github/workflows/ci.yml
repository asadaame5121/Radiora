name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, check, test, and build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify
        run: deno task verify

  surreal-integration:
    name: SurrealDB migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install SurrealDB
        run: |
          curl -sSf https://install.surrealdb.com | sh -s -- --version v3.2.3
          surreal version

      - name: Test schema migration and persistence
        run: deno task test:integration
