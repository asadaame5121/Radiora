name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, check, test, and build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify
        run: deno task verify

  duplicates:
    name: Duplicate-code SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"

      - name: Generate duplicate-code SARIF
        run: deno task duplicates:sarif

      - name: Upload duplicate-code SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/jscpd/jscpd-report.sarif

  static-analysis:
    name: Opengrep and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      OPENGREP_VERSION: "1.22.0"
      OPENGREP_SHA256: "45bcd58440e397ed52c50e953ccf5948909ea77087c9186fc7d277216f62e319"
      # v8.30.1 has a published binary/checksum regression; keep the last verified release.
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install verified Opengrep
        shell: bash
        run: |
          curl -fsSL "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86" -o /tmp/opengrep
          echo "${OPENGREP_SHA256}  /tmp/opengrep" | sha256sum --check
          chmod +x /tmp/opengrep

      - name: Run Opengrep
        shell: bash
        run: |
          mkdir -p reports
          /tmp/opengrep scan --error --sarif-output=reports/opengrep.sarif --config .opengrep/rules.yml src scripts

      - name: Upload Opengrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/opengrep.sarif

      - name: Install verified Gitleaks
        shell: bash
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Scan Git history for secrets
        run: /tmp/gitleaks git --redact --no-banner --verbose .

  a11y:
    name: Audit the mock application for WCAG A/AA violations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit the mock application
        run: npm run test:a11y

  mutation-preflight:
    name: Mutation preflight ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        batch: [parsers, projections, domain, storage, controllers]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true
      - run: npm ci
      - name: Verify mutation batch wiring
        run: npm run test:mutation:${{ matrix.batch }} -- --dryRunOnly

  surreal-integration:
    name: SurrealDB migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install SurrealDB
        run: |
          curl -sSf https://install.surrealdb.com | sh -s -- --version v3.2.3
          surreal version

      - name: Test schema migration and persistence
        run: deno task test:integration

  sidecar-cross-compile:
    name: Cross-compile Windows SurrealDB sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Build Windows GUI sidecar
        working-directory: tools/surreal-sidecar
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-H windowsgui" -o "$RUNNER_TEMP/radiora-surreal.exe" .

  surreal-sidecar-smoke:
    name: Windows SurrealDB sidecar smoke
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SURREALDB_VERSION: "3.2.3"
      SURREALDB_SHA256: "26311fce16da743cbf26f6edda3ec2427fa783eadb67301f676af7c63101f31a"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Download and verify SurrealDB CLI
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "surreal.exe"
          $url = "https://download.surrealdb.com/v$env:SURREALDB_VERSION/surreal-v$env:SURREALDB_VERSION.windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile $destination
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
          if ($actual -ne $env:SURREALDB_SHA256) {
            throw "SurrealDB CLI SHA-256 mismatch. Expected $env:SURREALDB_SHA256, got $actual"
          }
          "RADIORA_SURREAL_BUNDLE_SOURCE=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build sidecar bundle
        run: deno task desktop:sidecar

      - name: Run headless sidecar smoke
        run: deno run -A scripts/surreal_sidecar_smoke.ts
