# cargo-deny policy for the Radiora v3 product workspace (docs/design/v3-quality-gates.md Q3).
# cargo-deny is a tool pinned by mise.toml; it is not a Cargo dependency of the product.

[graph]
# Audited platforms: the Windows MSVC product build and the Linux portable gate.
# macOS-only crates are not audited until macOS becomes an officially supported target.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# A stale or unreachable advisory DB must fail the check instead of passing silently.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "0BSD",
  # File-level weak copyleft. Allowed for unmodified use through Cargo dependencies.
  "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# Crate boundaries (docs/design/v3-architecture.md section 1). `wrappers` lists the only crates
# allowed to depend directly on the banned crate. scripts/quality/rust_crate_boundaries.ts checks
# the same rules transitively from `cargo metadata`; both gates must pass.
[[bans.deny]]
crate = "loro"
wrappers = ["radiora-infra"]
reason = "Loro is an infra adapter detail; core and desktop must not see Loro types"

[[bans.deny]]
crate = "rusqlite"
wrappers = ["radiora-infra"]
reason = "SQLite access is an infra adapter detail"

[[bans.deny]]
crate = "tauri"
wrappers = ["radiora-desktop", "tauri-plugin-dialog", "tauri-plugin-fs"]
reason = "Tauri belongs to the desktop host only; its own plugins are the sole other dependents"

[[bans.deny]]
crate = "radiora-infra"
wrappers = ["radiora-desktop"]
reason = "core must not depend on infra; only the desktop composition root may"


[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
